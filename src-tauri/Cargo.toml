[package]
name = "clipmaru"
version = "0.1.0"
description = "ClipMaru - Windows 11向けクリップボード管理アプリ"
authors = ["kuniko (K-Studio3070 / AnnyStation)"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipmaru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
# Windows専用の低レベルクリップボードAPI。ClipMaruはWindows 11向けのみなので
# クロスプラットフォーム抽象(arboard等)より、CF_HTML(リッチ)を直接扱える
# こちらを採用(get_html/set_htmlがCF_HTMLヘッダの組み立て/剥がしを担ってくれる)。
clipboard-win = { version = "5.4.1", features = ["monitor"] }

