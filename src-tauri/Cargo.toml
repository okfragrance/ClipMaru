[package]
name = "clipmaru"
version = "0.1.0"
description = "ClipMaru - Windows 11向けクリップボード管理アプリ"
authors = ["kuniko (K-Studio3070 / AnnyStation)"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipmaru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: システムトレイ常駐(仕様§3・技術検討6)。左クリックでウィンドウ表示/非表示トグル。
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
# バックアップのエクスポート/インポート(保存/読込ダイアログ + ファイルI/O)用。
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# ウィンドウの位置・サイズ記憶(仕様§3: 終了時の位置を保存し次回起動時に復元)。
tauri-plugin-window-state = "2"
# Windowsスタートアップ登録(起動時に自動でClipMaruを開く)。設定パネルからトグル。
tauri-plugin-autostart = "2"
# Windows専用の低レベルクリップボードAPI。ClipMaruはWindows 11向けのみなので
# クロスプラットフォーム抽象(arboard等)より、CF_HTML(リッチ)を直接扱える
# こちらを採用(get_html/set_htmlがCF_HTMLヘッダの組み立て/剥がしを担ってくれる)。
clipboard-win = { version = "5.4.1", features = ["monitor"] }
# クリップボード画像履歴用。DIB(CF_DIB)から合成したBMPをデコードしPNG再エンコードする。
# 圧縮率が重要(スクリーンショット等は無圧縮BMPだと数MB→PNGなら大幅に軽くなる)ため、
# png/bmp のみ有効化(他フォーマットは不要)。
image = { version = "0.25.10", default-features = false, features = ["png", "bmp"] }
# 画像データをJSON経由でフロントへ渡すためのbase64エンコード用。
base64 = "0.23.0"

